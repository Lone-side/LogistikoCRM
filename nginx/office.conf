# LogistikoCRM — nginx configuration (office/LAN με εσωτερικό HTTPS)
#
# Αντικαθιστά το /etc/nginx/conf.d/default.conf μέσω bind mount από το
# docker-compose.office.yml — το production image ΔΕΝ αλλάζει.
#
# - :80  → 301 σε https (το container healthcheck ΔΕΝ περνά από εδώ:
#          μιλά απευθείας στο gunicorn, βλ. HEALTH_CHECK_EXEMPT_URLS)
# - :443 → TLS termination με το εσωτερικό certificate του γραφείου
#          (./certs, βλ. scripts/office_certs.sh) και X-Forwarded-Proto
#          https προς το Django (USE_X_FORWARDED_PROTO=True στο overlay),
#          ώστε το SECURE_SSL_REDIRECT να μην κάνει loop.
#
# ΜΗΝ αλλάζεις location blocks εδώ χωρίς να αλλάξεις και το
# nginx/nginx.conf — το tests/common/test_office_readiness.py
# (OfficeNginxParityTest) αποτυγχάνει αν αποκλίνουν.

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Όλη η HTTP κίνηση ανακατευθύνεται σε HTTPS σε επίπεδο nginx —
    # έτσι δεν φτάνει ποτέ insecure request στο Django (κανένα loop).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/office.crt;
    ssl_certificate_key /etc/nginx/certs/office.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    # gzip για κείμενο/JS/CSS
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # ---------- Django static files ----------
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- Protected media (internal — μόνο μέσω X-Accel-Redirect) ----------
    location /protected-media/ {
        internal;
        alias /var/www/media/;
    }

    # ---------- /media/: πάντα μέσω Django για έλεγχο πρόσβασης ----------
    location /media/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Django routes ----------
    # accounting API + portal, voip, health/api docs, OAuth, contact forms
    location ~ ^/(accounting|voip|api|OAuth-2|contact_form|rosetta)(/|$) {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # i18n routes (CRM/admin κάτω από language prefix, π.χ. /el/...)
    # Το regex με άγκιστρα ΠΡΕΠΕΙ να είναι σε quotes — χωρίς αυτά το
    # nginx -t αποτυγχάνει (unknown directive) και ο server δεν ξεκινά.
    location ~ "^/[a-z]{2}(-[a-z0-9]{2,8})?/" {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /favicon.ico {
        proxy_pass http://django;
        proxy_set_header Host $host;
    }

    # ---------- React SPA (default) ----------
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
