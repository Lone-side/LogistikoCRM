# LogistikoCRM — nginx configuration (production)
#
# - Σερβίρει το built React SPA στο /
# - Proxy στο Django (gunicorn) για API/admin/CRM
# - Static files απευθείας από το δίσκο
# - Protected media: το Django κάνει auth και επιστρέφει X-Accel-Redirect
#   στο internal location /protected-media/ — το nginx στέλνει το αρχείο.
#
# Για HTTPS: βάλε certbot/reverse proxy μπροστά ή πρόσθεσε listen 443 ssl
# με τα certificates σου (βλ. DEPLOYMENT.md).

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # gzip για κείμενο/JS/CSS
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # ---------- Django static files ----------
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- Protected media (internal — μόνο μέσω X-Accel-Redirect) ----------
    location /protected-media/ {
        internal;
        alias /var/www/media/;
    }

    # ---------- /media/: πάντα μέσω Django για έλεγχο πρόσβασης ----------
    location /media/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Django routes ----------
    # accounting API + portal, voip, health/api docs, OAuth, contact forms
    location ~ ^/(accounting|voip|api|OAuth-2|contact_form|rosetta)(/|$) {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # i18n routes (CRM/admin κάτω από language prefix, π.χ. /el/...)
    # Το regex με άγκιστρα ΠΡΕΠΕΙ να είναι σε quotes — χωρίς αυτά το
    # nginx -t αποτυγχάνει (unknown directive) και ο server δεν ξεκινά.
    location ~ "^/[a-z]{2}(-[a-z0-9]{2,8})?/" {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /favicon.ico {
        proxy_pass http://django;
        proxy_set_header Host $host;
    }

    # ---------- React SPA (default) ----------
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
