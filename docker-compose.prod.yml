# LogistikoCRM — Production Docker Compose
#
# Χρήση:
#   cp .env.production.example .env
#   nano .env   # ΣΥΜΠΛΗΡΩΣΕ SECRET_KEY, DB_PASSWORD, SITE_URL κλπ
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Διαφορές από το docker-compose.yml (development):
# - Χωρίς bind mount του κώδικα (τρέχει ο κώδικας του image)
# - nginx μπροστά (static, React SPA, protected media με X-Accel-Redirect)
# - DEBUG=False, υποχρεωτικό SECRET_KEY/DB_PASSWORD από .env

x-django-env: &django-env
  DEBUG: "False"
  # Το manage.py φορτώνει webcrm.settings_local, που χωρίς DJANGO_ENV
  # πέφτει στο development branch (DEBUG=True, ALLOWED_HOSTS=*, χωρίς
  # secure cookies/HSTS) και παρακάμπτει τα production fail-closed guards.
  # Το wsgi.py/celery.py φορτώνουν webcrm.settings και δεν επηρεάζονται.
  DJANGO_ENV: production
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  DB_ENGINE: django.db.backends.postgresql
  DB_NAME: ${DB_NAME:-logistikocrm}
  DB_USER: ${DB_USER:-logistiko}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  DB_HOST: db
  DB_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  REDIS_CACHE_URL: redis://redis:6379/1
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
  SITE_URL: ${SITE_URL:-http://localhost}
  MEDIA_ACCEL_REDIRECT: "True"
  NUM_PROXIES: "1"
  USE_X_FORWARDED_PROTO: ${USE_X_FORWARDED_PROTO:-False}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
  # Console email backend για ασφαλές acceptance με dummy δεδομένα: χωρίς
  # αυτό το passthrough η μεταβλητή του .env δεν έφτανε ΠΟΤΕ στα
  # containers και το Django έπεφτε πάντα σε πραγματικό SMTP. Default
  # κενό => παραγωγική συμπεριφορά (SMTP) αμετάβλητη.
  EMAIL_BACKEND_CONSOLE: ${EMAIL_BACKEND_CONSOLE:-}
  FRITZ_API_TOKEN: ${FRITZ_API_TOKEN:?Set FRITZ_API_TOKEN in .env}
  DATA_ENCRYPTION_KEY_CURRENT: ${DATA_ENCRYPTION_KEY_CURRENT:?Set DATA_ENCRYPTION_KEY_CURRENT in .env}
  DATA_ENCRYPTION_KEY_PREVIOUS: ${DATA_ENCRYPTION_KEY_PREVIOUS:-}
  DATA_ENCRYPTION_KEY_ID: ${DATA_ENCRYPTION_KEY_ID:-}
  ENFORCE_CLIENT_ASSIGNMENT: ${ENFORCE_CLIENT_ASSIGNMENT:-True}
  ALLOW_UNSCOPED_CLIENT_ACCESS: ${ALLOW_UNSCOPED_CLIENT_ACCESS:-False}
  # Import-time daemon threads race migrations and duplicate across gunicorn
  # and Celery processes. Production scheduling belongs exclusively to Celery.
  LEGACY_APP_THREADS_ENABLED: "False"
  MYDATA_USER_ID: ${MYDATA_USER_ID:-}
  MYDATA_SUBSCRIPTION_KEY: ${MYDATA_SUBSCRIPTION_KEY:-}
  MYDATA_ISSUER_VAT: ${MYDATA_ISSUER_VAT:-}
  MYDATA_IS_SANDBOX: ${MYDATA_IS_SANDBOX:-True}

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-logistikocrm}
      POSTGRES_USER: ${DB_USER:-logistiko}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-logistiko} -d ${DB_NAME:-logistikocrm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      <<: *django-env
    volumes:
      - media_volume:/app/media
      - logs_volume:/app/logs
      - backups_volume:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py createcachetable &&
             gunicorn webcrm.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health/\")'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  celery:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      <<: *django-env
    volumes:
      - media_volume:/app/media
      - logs_volume:/app/logs
      - backups_volume:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    command: celery -A webcrm worker -l info

  celery-beat:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      <<: *django-env
    volumes:
      - logs_volume:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
      celery:
        condition: service_started
    command: celery -A webcrm beat -l info

  nginx:
    build:
      context: .
      target: nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      # read-only πρόσβαση στα media για το X-Accel-Redirect
      - media_volume:/var/www/media:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_volume:
  logs_volume:
  backups_volume:
