name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Ρητή, ΣΥΝΕΠΗΣ δήλωση περιβάλλοντος: το settings_local αποτυγχάνει
      # κλειστά χωρίς DJANGO_ENV, και επίσης σε αντιφατικό ζεύγος
      # DJANGO_ENV/DEBUG (η εξαίρεση test runner καλύπτει το `manage.py
      # test`, ΟΧΙ το `manage.py migrate` του βήματος πιο κάτω).
      # DEBUG=True ταιριάζει με την πραγματική προηγούμενη τελική
      # συμπεριφορά: το development branch του settings_local επέβαλλε
      # έτσι κι αλλιώς DEBUG=True σε αυτό το job.
      DJANGO_ENV: 'development'
      DEBUG: 'True'
      SECRET_KEY: 'test-secret-key-for-ci-only'
      FRITZ_API_TOKEN: 'test-fritz-token-for-ci-only'
      # CI-only Fernet key (το production hard-fail απαιτεί έγκυρο κλειδί
      # και ρητή απόφαση για το RBAC ακόμη και στο migrate step)
      DATA_ENCRYPTION_KEY_CURRENT: 'jhgAUo9ScsDy8CjlAM8XO5cFANKz_Nb2i01amVUla0c='
      ALLOW_UNSCOPED_CLIENT_ACCESS: 'True'
      DB_ENGINE: 'django.db.backends.postgresql'
      DB_NAME: 'test_db'
      DB_USER: 'test_user'
      DB_PASSWORD: 'test_password'
      DB_HOST: 'localhost'
      DB_PORT: '5432'
      CELERY_BROKER_URL: 'redis://localhost:6379'
      REDIS_CACHE_URL: 'redis://localhost:6379/1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      - name: Run tests
        run: |
          # ΟΛΑ τα πακέτα. Έλειπαν τα settings/tasks/voip/integration/
          # utils/chat/help/massmail — 159 tests που δεν έτρεχαν ΠΟΤΕ στο
          # CI, ανάμεσά τους το tests.settings που φυλάει τη runtime
          # configuration παραγωγής (Celery broker, cache backend,
          # DJANGO_ENV, compose, ALLOWED_HOSTS).
          python manage.py test tests.accounting tests.crm tests.common tests.inventory tests.mydata tests.settings tests.tasks tests.voip tests.integration tests.utils tests.chat tests.help tests.massmail --keepdb -v 2

      # PostgreSQL concurrency proof (Γύρος 18 — F2, Γύρος 22): πραγματικά
      # race tests με δύο threads/connections — filing services ΚΑΙ
      # SharedLink quota/revocation (SharedLinkConcurrencyTest). BLOCKING:
      # το test αποτυγχάνει (όχι skip) αν δεν τρέχει σε PostgreSQL.
      - name: PostgreSQL concurrency tests (blocking)
        env:
          REQUIRE_POSTGRES_TESTS: '1'
        run: |
          python manage.py test tests.accounting.test_concurrency_postgres --keepdb -v 2

      - name: Run tests with coverage
        run: |
          coverage run manage.py test tests.accounting tests.crm tests.common tests.mydata --keepdb
          coverage report --fail-under=45
          coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting tools
        run: |
          pip install black flake8 isort

      # Black/isort: το ιστορικό codebase δεν είναι φορμαρισμένο (repo-wide
      # follow-up). Τα steps τρέχουν κανονικά και ΦΑΙΝΟΝΤΑΙ κόκκινα όταν
      # αποτυγχάνουν (χωρίς "|| echo" που έκρυβε το exit code), αλλά δεν
      # μπλοκάρουν ακόμη το job μέχρι το φορμάρισμα του legacy κώδικα.
      - name: Check code formatting with Black (non-blocking until repo reformat)
        continue-on-error: true
        run: black --check --diff .

      - name: Check import sorting with isort (non-blocking until repo reformat)
        continue-on-error: true
        run: isort --check-only --diff .

      - name: Lint with flake8 (errors are blocking)
        run: |
          # Σφάλματα σύνταξης/ονομάτων/συγκρίσεων: πάντα αποτυχία CI
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Flake8 full report (informational)
        run: |
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Audit Python dependencies (blocking)
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt

      # The legacy codebase has a reviewed medium-severity Bandit backlog.
      # New high-severity findings are release blockers immediately; medium
      # findings remain visible in the informational report below until the
      # backlog is replaced with narrowly documented exceptions.
      - name: Bandit high-severity gate (blocking)
        run: |
          pip install bandit[toml]
          bandit -r accounting crm common inventory mydata settings webcrm \
            -c pyproject.toml -lll -q

      - name: Bandit medium/high report (informational)
        continue-on-error: true
        run: |
          bandit -r accounting crm common inventory mydata settings webcrm \
            -c pyproject.toml -ll

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Audit production frontend dependencies (blocking)
        working-directory: ./frontend
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (blocking)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Το lint baseline καθαρίστηκε (d58f4e5) και επαληθεύτηκε καθαρό στις
      # 15/08/2026 — το gate είναι πλέον μπλοκαριστικό, όπως απαιτεί το
      # docs/GO_LIVE_2026-08-17.md §2.
      - name: Lint
        run: npm run lint

  # Production security smoke: επιβεβαιώνει ότι η εφαρμογή εκκινεί και τα
  # RBAC tests περνούν με ΠΡΑΓΜΑΤΙΚΟ production configuration —
  # DEBUG=False, ENFORCE_CLIENT_ASSIGNMENT=True, έγκυρο Fernet key,
  # ΧΩΡΙΣ ALLOW_UNSCOPED_CLIENT_ACCESS escape hatch.
  security-smoke:
    runs-on: ubuntu-latest

    env:
      DEBUG: 'False'
      DJANGO_ENV: 'production'
      SECRET_KEY: 'ci-smoke-secret-key-not-for-production'
      FRITZ_API_TOKEN: 'ci-smoke-fritz-token'
      ALLOWED_HOSTS: 'localhost,127.0.0.1'
      ENFORCE_CLIENT_ASSIGNMENT: 'True'
      # CI-only Fernet key — δεν χρησιμοποιείται πουθενά αλλού
      DATA_ENCRYPTION_KEY_CURRENT: 'jhgAUo9ScsDy8CjlAM8XO5cFANKz_Nb2i01amVUla0c='

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Django deploy checks
        run: python manage.py check --deploy

      - name: Migration consistency
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py migrate --check

      - name: Setup roles (RBAC groups)
        run: python manage.py setup_roles

      - name: RBAC smoke tests
        run: |
          python manage.py test \
            tests.accounting.test_rbac_enforcement \
            tests.accounting.test_final_hardening \
            tests.accounting.test_rbac_round12 \
            tests.accounting.test_rbac_round13 \
            tests.accounting.test_rbac_round14 \
            tests.accounting.test_rbac_round15 \
            tests.accounting.test_rbac_round16 \
            tests.accounting.test_rbac_round17 \
            tests.accounting.test_rbac_round18 \
            tests.accounting.test_rbac_round19 \
            tests.accounting.test_rbac_round20 \
            tests.accounting.test_rbac_round21 \
            tests.accounting.test_rbac_round22 \
            tests.accounting.test_rbac_round23 \
            -v 2

      # Blocking production-mode έλεγχοι (Γύρος 20): fail-closed libmagic
      # στην πραγματική upload διαδρομή + document invariant enforcement.
      # REQUIRE_LIBMAGIC=True → κάθε αποτυχία detection απορρίπτει upload.
      - name: Production-mode libmagic + invariant enforcement (blocking)
        env:
          REQUIRE_LIBMAGIC: 'True'
        run: |
          python manage.py test \
            tests.accounting.test_rbac_round20.MimeFailClosedTest \
            tests.accounting.test_rbac_round20.PermissionsBeforeLocksTest \
            tests.accounting.test_rbac_round19.DbConstraintTest \
            tests.accounting.test_rbac_round19.KeepSlotTest \
            tests.accounting.test_rbac_round21.PermissionBeforeParsingTest \
            tests.accounting.test_rbac_round21.CapabilityClientBindingTest \
            tests.accounting.test_rbac_round22.SharedLinkTargetInvariantTest \
            tests.accounting.test_rbac_round22.SharedLinkAtomicRevocationTest \
            -v 2

      # Το audit command πρέπει να τρέχει καθαρά σε ΦΡΕΣΚΙΑ (κενή) βάση.
      # ΠΡΟΣΟΧΗ — ΜΟΝΟ για CI: σε πραγματική production βάση τα findings
      # `legacy-slot-needs-review` είναι ΑΝΑΜΕΝΟΜΕΝΑ μετά τα migrations
      # 10020/10021, οπότε το --fail-on-findings ΔΕΝ πρέπει να μπει ως
      # blocking deploy gate. Στο production runbook: εκτέλεση ΧΩΡΙΣ το
      # flag, αποθήκευση του output και χειροκίνητη αξιολόγηση· blocking
      # μόνο για απρόσμενες κατηγορίες findings (βλ. DEPLOYMENT.md).
      - name: ClientDocument invariant audit (blocking — CI only)
        run: python manage.py audit_clientdocument_invariants --fail-on-findings

  # Χτίζει τα production images (frontend → app → nginx) και επικυρώνει
  # τα nginx configs + το merged office compose configuration. Blocking:
  # το nginx.conf syntax bug (unquoted regex braces) έζησε απαρατήρητο
  # ακριβώς επειδή το CI δεν έχτιζε ποτέ τα images. Το containers-up +
  # healthy + preflight παραμένει χειροκίνητο office-host acceptance
  # gate (docs/OFFICE_RUNBOOK.md §5) — εδώ επικυρώνεται build + config.
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build production images (frontend → app → nginx)
        run: |
          docker build --target nginx -t logistiko-nginx-ci .
          docker build --target app -t logistiko-app-ci .

      - name: nginx -t (baked production config)
        run: docker run --rm logistiko-nginx-ci nginx -t

      # Runtime smoke ως ο πραγματικός μη-root user του image: πιάνει
      # defects που δεν φαίνονται στο build (π.χ. root-owned tendo locks
      # από build-time collectstatic => PermissionError crash loop).
      - name: App image runtime smoke (django check ως non-root)
        run: |
          docker run --rm \
            -e SECRET_KEY=ci-runtime-smoke-not-a-real-secret \
            -e DEBUG=True \
            logistiko-app-ci python manage.py check

      # Ο pg client του image πρέπει να έχει το ίδιο major με τον postgres
      # server του compose — αλλιώς τα backups γράφονται αλλά ΔΕΝ
      # επαναφέρονται (v17 dumps σε v15 server => pg_restore rollback).
      - name: pg_dump/server version parity
        run: |
          CLIENT_MAJOR=$(docker run --rm logistiko-app-ci pg_dump --version | grep -oE '[0-9]+' | head -1)
          SERVER_MAJOR=$(grep -oE 'image: postgres:[0-9]+' docker-compose.prod.yml | grep -oE '[0-9]+')
          echo "client=$CLIENT_MAJOR server=$SERVER_MAJOR"
          test "$CLIENT_MAJOR" = "$SERVER_MAJOR"

      - name: nginx -t (office TLS config με throwaway certs)
        run: |
          ./scripts/office_certs.sh ci.office.test 127.0.0.1
          docker run --rm \
            -v "$PWD/nginx/office.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/certs/office.crt:/etc/nginx/certs/office.crt:ro" \
            -v "$PWD/certs/office.key:/etc/nginx/certs/office.key:ro" \
            logistiko-nginx-ci nginx -t

      - name: Compose config validation (prod + office overlay)
        run: |
          cat > /tmp/office-ci.env <<'ENVEOF'
          SECRET_KEY=ci-compose-validation-secret-key-not-a-real-secret-000
          DB_PASSWORD=ci-compose-validation-not-a-real-secret
          FRITZ_API_TOKEN=ci-compose-validation-not-a-real-secret
          DATA_ENCRYPTION_KEY_CURRENT=jhgAUo9ScsDy8CjlAM8XO5cFANKz_Nb2i01amVUla0c=
          OFFICE_BIND_IP=127.0.0.1
          ENVEOF
          docker compose -f docker-compose.prod.yml -f docker-compose.office.yml \
            --env-file /tmp/office-ci.env config --format json > /tmp/merged.json
          python3 - <<'PYEOF'
          import json
          services = json.load(open('/tmp/merged.json'))['services']
          # 1. Κανένα host port σε db/redis/web/celery/celery-beat
          for name in ('db', 'redis', 'web', 'celery', 'celery-beat'):
              assert not services[name].get('ports'), f'{name} εκθέτει ports'
          # 2. Το nginx δένει ΜΟΝΟ στο OFFICE_BIND_IP
          ports = services['nginx']['ports']
          assert ports, 'το nginx δεν έχει ports'
          for port in ports:
              assert port.get('host_ip') == '127.0.0.1', port
          # 3. Το CA private key (ή όλος ο certs dir) δεν γίνεται mount πουθενά
          for name, service in services.items():
              for volume in service.get('volumes', []):
                  source = volume.get('source', '')
                  assert 'office-ca.key' not in source, (name, source)
                  assert not source.rstrip('/').endswith('/certs'), (name, source)
          print('merged office compose config: OK')
          PYEOF
