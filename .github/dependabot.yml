
version: 2
updates:
  - package-ecosystem: pip # See documentation for possible values
    directory: "/" # Location of package manifests
    open-pull-requests-limit: 5
    schedule:
      interval: "daily"
      time: "08:00"

  - package-ecosystem: npm
    directory: "/frontend"
    open-pull-requests-limit: 5
    schedule:
      interval: "daily"
      time: "08:15"

  - package-ecosystem: github-actions
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
